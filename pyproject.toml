[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muxnet"
version = "0.1.0"
description = "Loss-aware design of photon-source multiplexing switch networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Degala Chenchupradeep" }]
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
